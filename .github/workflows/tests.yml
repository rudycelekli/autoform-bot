name: tests

on:
  # main tests each merged commit. scratch/ branches run CI on a branch with no
  # pull request; every other branch runs through pull_request.
  push:
    branches: [main, "scratch/**"]
  pull_request:

permissions:
  contents: read

# A newer commit on a pull request cancels the run for the older one. Each push
# gets a group of its own: runs that share a group wait one at a time, and a
# newer one cancels any still waiting, so runs on main would skip commits.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
      - name: Install pinned explorer compiler
        run: |
          timeout --signal=TERM --kill-after=30s 3m npm ci --ignore-scripts --no-audit --no-fund --prefer-offline \
            --fetch-timeout=30000 --fetch-retries=2 --fetch-retry-mintimeout=2000 --fetch-retry-maxtimeout=10000
      - run: npm run check:explorer
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked --extra dev --extra repl
      # Generated projects' CI runs the audit helper with the runner's python3, which
      # can be 3.10, so one leg puts a 3.10 on PATH for the test that runs it there.
      - name: Python 3.10 for the audit helper's test
        if: matrix.python-version == '3.11'
        run: |
          uv python install 3.10
          mkdir -p "$RUNNER_TEMP/python3.10"
          ln -s "$(uv python find 3.10)" "$RUNNER_TEMP/python3.10/python3.10"
          echo "$RUNNER_TEMP/python3.10" >> "$GITHUB_PATH"
          echo "AUTOFORM_REQUIRE_PYTHON310_TESTS=1" >> "$GITHUB_ENV"
      - run: uv run ruff check autoform_cli servers tests
      - run: uv run pytest -q
        env:
          AUTOFORM_REQUIRE_NODE_TESTS: "1"
      - run: make check-example
      - name: Each map mutant fails its jsdom test
        if: always()
        run: python3 scratch_teeth/teeth.py scratch_teeth/unit-mutants.json
        env:
          AUTOFORM_REQUIRE_NODE_TESTS: "1"

  browser:
    name: WebKit integrated book and explorer regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Playwright's image for the pinned playwright==1.62.0 carries WebKit and its
    # system libraries, so the job does not fetch them from an Ubuntu mirror;
    # that apt step alone has taken over 8 minutes and timed the job out.
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
    # In a container, run steps default to sh; keep bash, as on the host jobs.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          python-version: "3.13"
          enable-cache: true
      - name: Install locked browser test environment
        run: uv sync --frozen --extra dev --extra browser
      # The explorer's typesetting runs the real MathJax, served in place of
      # the CDN from the same checked tarball as the MathJax job's.
      - name: Install pinned MathJax 3.2.2
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 2m curl -sSfL \
            https://registry.npmjs.org/mathjax/-/mathjax-3.2.2.tgz -o mathjax.tgz
          echo "1b9c0a1c44df864e915690558e72adb9cc5203360daefd385084ced3b6c64c09  mathjax.tgz" \
            | sha256sum --check --strict
          mkdir mathjax
          tar xzf mathjax.tgz -C mathjax
          echo "AUTOFORM_MATHJAX_DIR=$PWD/mathjax/package" >> "$GITHUB_ENV"
          echo "AUTOFORM_MATHJAX_ES5=$PWD/mathjax/package/es5" >> "$GITHUB_ENV"
      - name: Run integrated book, explorer and genuine MathJax regressions
        run: >-
          uv run --frozen --extra dev --extra browser pytest -q
          tests/test_dag_viewer_browser.py tests/test_integrated_explorer_browser.py
          tests/test_integrated_workspace_browser.py tests/test_integrated_continuity_browser.py
          tests/test_scoped_overview_browser.py
          tests/test_integrated_selected_focus_browser.py tests/test_integrated_phone_back_browser.py
          tests/test_integrated_reader_first_browser.py tests/test_project_map_browser.py
        env:
          AUTOFORM_REQUIRE_BROWSER_TESTS: "1"
          AUTOFORM_REQUIRE_MATHJAX_TESTS: "1"
          AUTOFORM_UI_SCREENSHOT_DIR: ${{ runner.temp }}/autoform-ui-evidence
      - name: Each explorer mutant fails its WebKit test
        if: always()
        run: python3 scratch_teeth/teeth.py scratch_teeth/browser-mutants.json
        env:
          AUTOFORM_REQUIRE_BROWSER_TESTS: "1"
          AUTOFORM_REQUIRE_MATHJAX_TESTS: "1"
      - name: Preserve browser UI screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: integrated-ui-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/autoform-ui-evidence
          if-no-files-found: warn
          retention-days: 7
